<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鳥オークション広場</title>
<style>
body{
  background:#050505;
  color:white;
  text-align:center;
  font-family:sans-serif;
  margin:0;
  padding:20px;
}
.card{
  max-width:700px;
  margin:auto;
  padding:20px;
  border-radius:15px;
  background:rgba(255,255,255,0.05);
  border:1px solid #333;
}
#coins{
  color:gold;
  font-size:1.5rem;
  font-weight:bold;
}
#birdName{
  font-size:2rem;
  color:#00bfff;
}
#birdEmoji{
  font-size:5rem;
}
button{
  background:#00bfff;
  color:black;
  border:none;
  padding:12px 24px;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
}
button:hover{
  opacity:0.9;
}
#news{
  color:gold;
  margin:15px;
  font-weight:bold;
}
.collection{
  margin-top:30px;
}
.birdItem{
  display:inline-block;
  margin:5px;
  padding:8px;
  border-radius:10px;
  background:#222;
}
</style>
</head>
<body>
<h1>🏛️ 鳥オークション広場</h1>
<div id="coins">所持コイン: 0</div>
<div id="news"></div>
<div class="card">
<div id="birdEmoji">🐤</div>
<h2 id="birdName">読み込み中...</h2>
<p id="birdDesc"></p>
<h3 id="price">価格: 0コイン</h3>
<button onclick="buyBird()">
💰 落札する
</button>
</div>
<div class="collection">
<h2>📚 あなたの鳥図鑑</h2>
<div id="collection"></div>
</div>
<br>
<button onclick="location.href='secret.html'">
← 聖域へ戻る
</button>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyA1pKhHN6HkYa8ZBNoZowm6RHbKLxuulzg",
  authDomain: "kotori-auction.firebaseapp.com",
  projectId: "kotori-auction",
  storageBucket: "kotori-auction.firebasestorage.app",
  messagingSenderId: "977595007262",
  appId: "1:977595007262:web:5e5a7b850bcfa31ea2090f",
  measurementId: "G-BTZBFKLHQC"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

try {
  await signInAnonymously(auth);
} catch (e) {
  console.error("匿名認証に失敗しました:", e);
}

window.db = db;
window.auth = auth;
</script>

<script>
// グローバル変数の定義
let currentBird = null;

// 初回のみ所持金を10000コインに設定（デバッグ・テスト用）
if (localStorage.getItem("coins") === null) {
  localStorage.setItem("coins", "10000");
}

const rarityTable = [
  {name: "ノーマル", chance: 60, color: "#ffffff"},
  {name: "レア", chance: 25, color: "#4fc3f7"},
  {name: "エピック", chance: 10, color: "#ba68c8"},
  {name: "レジェンド", chance: 4, color: "#ffd54f"},
  {name: "ゴッド", chance: 1, color: "#ff4444"}
];

const emojis = ["🐤","🐥","🐦","🕊️","🦉","🐧","🦚","🦩","🦜","🦢"];

const prefixes = [
  "寝坊","哲学","監査","無職","会議",
  "暴走","混乱","伝説","深夜","昼寝",
  "虚無","錬金","神託","爆発","量子",
  "陰謀","迷子","超越","覚醒","終末",
  "禁断","黄金","神速","混沌","究極"
];

const suffixes = [
  "鳥","大臣","司祭","教授","主任",
  "監督","皇帝","マスター","預言者",
  "執行官","管理者","博士","神官",
  "騎士","商人"
];

const traits = [
  "なぜか人気",
  "市場を支配した",
  "3秒で寝る",
  "会議を破壊する",
  "哲学を売っている",
  "存在が怪しい",
  "税金に詳しい",
  "誰も見たことがない",
  "伝説扱いされている",
  "鳴き声がうるさい",
  "徳を集めている",
  "小鳥教公認",
  "謎の資産家",
  "折り紙が得意",
  "市場から警戒されている"
];

const newsList = [
  "📈 監査鳥バブル発生",
  "📉 哲学鳥ショック",
  "🏛️ 鳥類会議開催",
  "🐤 無職鳥人気急上昇",
  "📰 寝坊鳥が市場を巻",
  "⚠️ 市場が混乱しています",
  "💰 錬金鳥が暴騰中",
  "🌟 ゴッド鳥目撃情報",
  "☠️ 存在しない鳥の噂",
  "📜 教祖鳥が声明発表"
];

function updateCoins() {
  const coins = parseInt(localStorage.getItem("coins") || "0", 10);
  document.getElementById("coins").innerText = "所持コイン: " + coins;
}

function getRarity(){
  const roll = Math.random() * 100;
  let total = 0;
  for(const rarity of rarityTable){
    total += rarity.chance;
    if(roll <= total){
      return rarity;
    }
  }
  return rarityTable[0];
}

function generateBird(){
  if(Math.random() < 0.005){
    currentBird = {
      emoji: "☠️",
      rarity: "神話級",
      rarityColor: "#ff00ff",
      name: "存在しない鳥",
      trait: "本来存在しないはずの個体",
      price: 9999
    };
  } else {
    const rarity = getRarity();
    const emoji = emojis[Math.floor(Math.random() * emojis.length)];
    const prefix = prefixes[Math.floor(Math.random() * prefixes.length)];
    const suffix = suffixes[Math.floor(Math.random() * suffixes.length)];
    const trait = traits[Math.floor(Math.random() * traits.length)];
    let price;
    switch(rarity.name){
      case "ノーマル":
        price = 50 + Math.floor(Math.random() * 150);
        break;
      case "レア":
        price = 200 + Math.floor(Math.random() * 300);
        break;
      case "エピック":
        price = 500 + Math.floor(Math.random() * 700);
        break;
      case "レジェンド":
        price = 1500 + Math.floor(Math.random() * 1500);
        break;
      case "ゴッド":
        price = 5000 + Math.floor(Math.random() * 5000);
        break;
    }
    currentBird = {
      emoji,
      rarity: rarity.name,
      rarityColor: rarity.color,
      name: prefix + suffix,
      trait,
      price
    };
  }

  document.getElementById("birdEmoji").innerText = currentBird.emoji;
  document.getElementById("birdName").innerHTML = currentBird.name + "【<span style='color:" + currentBird.rarityColor + "'>" + currentBird.rarity + "</span>】";
  document.getElementById("birdDesc").innerText = currentBird.trait;
  document.getElementById("price").innerText = "価格: " + currentBird.price + "コイン";
}

function renderCollection(){
  const area = document.getElementById("collection");
  area.innerHTML = "";
  const collection = JSON.parse(localStorage.getItem("birdCollection") || "[]");
  collection.forEach(b => {
    const div = document.createElement("div");
    div.className = "birdItem";
    div.innerHTML = b.emoji + " " + b.name;
    area.appendChild(div);
  });
}

function buyBird() {
  if (!currentBird) return;
  
  let coins = parseInt(localStorage.getItem("coins") || "0", 10);
  if (coins < currentBird.price) {
    alert("コインが足りません！");
    return;
  }
  
  // コインの減算と保存
  coins -= currentBird.price;
  localStorage.setItem("coins", coins.toString());
  
  // コレクションへの追加と保存
  const collection = JSON.parse(localStorage.getItem("birdCollection") || "[]");
  collection.push(currentBird);
  localStorage.setItem("birdCollection", JSON.stringify(collection));
  
  alert(currentBird.name + " を落札しました！");
  
  // 画面の更新
  updateCoins();
  renderCollection();
  generateBird(); // 次の鳥を出す
}

window.onload = () => {
  updateCoins();
  generateBird();
  renderCollection();
  document.getElementById("news").innerText = newsList[Math.floor(Math.random() * newsList.length)];
};
</script>
</body>
</html>
