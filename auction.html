<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>マルチ対応！リアルタイム鳥オークション広場</title>
<style>
body{
  background:#050505;
  color:white;
  text-align:center;
  font-family:sans-serif;
  margin:0;
  padding:20px;
}
.card{
  max-width:700px;
  margin:auto;
  padding:20px;
  border-radius:15px;
  background:rgba(255,255,255,0.05);
  border:1px solid #333;
}
#coins{
  color:gold;
  font-size:1.5rem;
  font-weight:bold;
}
#username-display{
  color: #4fc3f7;
  font-weight: bold;
  margin-bottom: 10px;
}
#birdName{
  font-size:2rem;
  color:#00bfff;
}
#birdEmoji{
  font-size:5rem;
}
.btn-group {
  display: flex;
  justify-content: center;
  gap: 15px;
  margin-top: 15px;
}
button{
  background:#00bfff;
  color:black;
  border:none;
  padding:12px 24px;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
  font-size: 1rem;
}
button:hover{
  opacity:0.9;
}
button:disabled {
  background: #555;
  color: #aaa;
  cursor: not-allowed;
}
#news{
  color:gold;
  margin:15px;
  font-weight:bold;
  min-height: 1.2em;
}
#timer {
  font-size: 1.5rem;
  color: #ff4444;
  font-weight: bold;
  margin: 10px 0;
}
#auctionStatus {
  color: #a7ffeb;
  font-weight: bold;
  margin: 10px 0;
}
.collection{
  margin-top:30px;
}
.birdItem{
  display:inline-block;
  margin:5px;
  padding:8px;
  border-radius:10px;
  background:#222;
}
/* ログインモーダル */
#login-overlay {
  position: fixed; top:0; left:0; width:100%; height:100%;
  background: rgba(0,0,0,0.9); display: flex; justify-content: center; align-items: center;
  z-index: 100;
}
.login-box {
  background: #222; padding: 30px; border-radius: 10px; border: 1px solid #444;
}
.login-box input {
  padding: 10px; font-size: 1rem; border-radius: 5px; border: 1px solid #666; width: 80%; margin-bottom: 15px;
}
</style>
</head>
<body>

<div id="login-overlay">
  <div class="login-box">
    <h2>🏛️ オークション広場にログイン</h2>
    <p>競りに参加するための名前を入力してください</p>
    <input type="text" id="username-input" placeholder="ハンター名を入力..." maxlength="10"><br>
    <button id="login-submit-btn" disabled>読み込み中...</button>
  </div>
</div>

<h1>🏛️ マルチ対応！リアルタイム鳥オークション</h1>
<div id="username-display">あなた: 未ログイン</div>
<div id="coins">所持コイン: 0</div>
<div id="news">オークションの開始を待っています...</div>

<div class="card">
<div id="timer">残り時間: --秒</div>
<div id="birdEmoji">🐤</div>
<h2 id="birdName">読み込み中...</h2>
<p id="birdDesc"></p>
<div id="auctionStatus">現在の最高入札者: なし</div>
<h3 id="price">現在の価格: 0コイン</h3>

<div class="btn-group">
  <button id="bidBtn" onclick="playerBid()" disabled>🔨 +100コインで入札</button>
  <button id="buyNowBtn" onclick="buyNow()" disabled>💰 即決落札する</button>
</div>
<button id="nextBtn" onclick="hostNewAuction()" style="margin-top:15px; background:#ffd54f;">新しい鳥を出品する</button>
</div>

<div class="collection">
<h2>📚 あなたの鳥図鑑</h2>
<div id="collection"></div>
</div>
<br>
<button onclick="location.href='secret.html'">
← 聖域へ戻る
</button>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, setDoc, updateDoc, onSnapshot, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyA1pKhHN6HkYa8ZBNoZowm6RHbKLxuulzg",
  authDomain: "kotori-auction.firebaseapp.com",
  projectId: "kotori-auction",
  storageBucket: "kotori-auction.firebasestorage.app",
  messagingSenderId: "977595007262",
  appId: "1:977595007262:web:5e5a7b850bcfa31ea2090f",
  measurementId: "G-BTZBFKLHQC"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

// グローバルにFirebase関数を展開
window.db = db;
window.doc = doc;
window.setDoc = setDoc;
window.updateDoc = updateDoc;

// 匿名認証
try {
  await signInAnonymously(auth);
  // 認証が成功したらログインボタンを押せるようにする
  const loginBtn = document.getElementById("login-submit-btn");
  loginBtn.innerText = "入場する";
  loginBtn.disabled = false;
  loginBtn.onclick = () => {
    const name = document.getElementById("username-input").value.trim();
    if(name) {
      window.myName = name;
      document.getElementById("username-display").innerText = "あなた: " + name;
      document.getElementById("login-overlay").style.display = "none";
      // データベースの監視を開始
      startListeningAuction();
    } else {
      alert("名前を入力してください！");
    }
  };
} catch (e) {
  console.error("匿名認証に失敗しました:", e);
  alert("通信エラーが発生しました。");
}
</script>

<script>
// ゲームロジック
let currentAuctionData = null;
let localTimerInterval = null;

if (localStorage.getItem("coins") === null) {
  localStorage.setItem("coins", "10000");
}

const rarityTable = [
  {name: "ノーマル", chance: 60, color: "#ffffff"},
  {name: "レア", chance: 25, color: "#4fc3f7"},
  {name: "エピック", chance: 10, color: "#ba68c8"},
  {name: "レジェンド", chance: 4, color: "#ffd54f"},
  {name: "ゴッド", chance: 1, color: "#ff4444"}
];
const emojis = ["🐤","🐥","🐦","🕊️","🦉","🐧","🦚","🦩","🦜","🦢"];
const prefixes = ["寝坊","哲学","監査","無職","会議","暴走","混乱","伝説","深夜","昼寝","虚無","錬金","神託","爆発","量子","陰謀","迷子","超越","覚醒","終末","禁断","黄金","神速","混沌","究極"];
const suffixes = ["鳥","大臣","司祭","教授","主任","監督","皇帝","マスター","預言者","執行官","管理者","博士","神官","騎士","商人"];
const traits = ["なぜか人気","市場を支配した","3秒で寝る","会議を破壊する","哲学を売っている","存在が怪しい","税金に詳しい","誰も見たことがない","伝説扱いされている","鳴き声がうるさい","徳を集めている","小鳥教公認","謎の資産家","折り紙が得意","市場から警戒されている"];

function updateCoins() {
  const coins = parseInt(localStorage.getItem("coins") || "0", 10);
  document.getElementById("coins").innerText = "所持コイン: " + coins;
}

function getRarity(){
  const roll = Math.random() * 100;
  let total = 0;
  for(const rarity of rarityTable){
    total += rarity.chance;
    if(roll <= total){ return rarity; }
  }
  return rarityTable[0];
}

// 1. 全員で同期するためのFirestoreリアルタイムリスナー
function startListeningAuction() {
  const auctionDocRef = window.doc(window.db, "auctions", "current");

  window.onSnapshot(auctionDocRef, (snapshot) => {
    if (!snapshot.exists()) {
      document.getElementById("news").innerText = "現在オークションは開催されていません。「新しい鳥を出品する」を押してください。";
      return;
    }

    const data = snapshot.data();
    currentAuctionData = data;

    // 画面表示の上書き（全員同時に同じ内容に変わる）
    document.getElementById("birdEmoji").innerText = data.bird.emoji;
    document.getElementById("birdName").innerHTML = data.bird.name + "【<span style='color:" + data.bird.rarityColor + "'>" + data.bird.rarity + "</span>】";
    document.getElementById("birdDesc").innerText = data.bird.trait;
    document.getElementById("price").innerHTML = `現在の価格: <span style="color:yellow">${data.currentPrice}</span> コイン <br><small style="color:#aaa">(即決価格: ${data.bird.price} コイン)</small>`;
    document.getElementById("auctionStatus").innerText = `現在の最高入札者: 🎉 ${data.highestBidder} (${data.highestBidderName || 'なし'})`;

    // ボタンの制御
    if (data.status === "active") {
      document.getElementById("bidBtn").disabled = false;
      document.getElementById("buyNowBtn").disabled = false;
      startLocalTimer(data.endTime);
    } else {
      document.getElementById("bidBtn").disabled = true;
      document.getElementById("buyNowBtn").disabled = true;
      clearInterval(localTimerInterval);
      
      if (data.status === "sold") {
        document.getElementById("timer").innerText = "落札終了！";
        document.getElementById("news").innerText = `📢 ${data.highestBidderName} さんが ${data.currentPrice} コインで落札しました！`;
      } else if (data.status === "timeout") {
        document.getElementById("timer").innerText = "タイムアップ！";
        if (data.highestBidder === "なし") {
          document.getElementById("news").innerText = "流札しました。誰も入札しませんでした。";
        } else {
          document.getElementById("news").innerText = `📢 タイムアップ！ ${data.highestBidderName} さんの落札です！`;
        }
      }
    }
  });
}

// 2. ローカルでのカウントダウン処理（サーバーの終了時刻を基準に計算）
function startLocalTimer(endTimeTimestamp) {
  clearInterval(localTimerInterval);
  localTimerInterval = setInterval(() => {
    const now = Date.now();
    const diff = Math.ceil((endTimeTimestamp - now) / 1000);

    if (diff <= 0) {
      clearInterval(localTimerInterval);
      document.getElementById("timer").innerText = "終了処理中...";
      // 自分が最高入札者の状態でタイムアップしたら、終了ステータスを送信
      if (currentAuctionData && currentAuctionData.status === "active" && currentAuctionData.highestBidderUid === window.myName) {
         triggerEndAuction("timeout");
      }
    } else {
      document.getElementById("timer").innerText = "残り時間: " + diff + "秒";
    }
  }, 500);
}

// 3. 新しい鳥を全員の画面に出品する（誰が押してもOK）
async function hostNewAuction() {
  let bird;
  if(Math.random() < 0.005){
    bird = { emoji: "☠️", rarity: "神話級", rarityColor: "#ff00ff", name: "存在しない鳥", trait: "本来存在しないはずの個体", price: 9999 };
  } else {
    const rarity = getRarity();
    bird = {
      emoji: emojis[Math.floor(Math.random() * emojis.length)],
      rarity: rarity.name,
      rarityColor: rarity.color,
      name: prefixes[Math.floor(Math.random() * prefixes.length)] + suffixes[Math.floor(Math.random() * suffixes.length)],
      trait: traits[Math.floor(Math.random() * traits.length)],
      price: (50 + Math.floor(Math.random() * 2000)) * 2 
    };
  }

  const startPrice = Math.floor(bird.price * 0.3);
  const duration = 15 * 1000; // 制限時間15秒
  const endTime = Date.now() + duration;

  const auctionDocRef = window.doc(window.db, "auctions", "current");
  await window.setDoc(auctionDocRef, {
    bird: bird,
    currentPrice: startPrice,
    highestBidder: "なし",
    highestBidderName: "なし",
    highestBidderUid: "",
    endTime: endTime,
    status: "active"
  });
}

// 4. 他のプレイヤーと競り合う（入札ボタン）
async function playerBid() {
  if (!currentAuctionData || currentAuctionData.status !== "active") return;

  let coins = parseInt(localStorage.getItem("coins") || "0", 10);
  const nextPrice = currentAuctionData.currentPrice + 100;

  if (coins < nextPrice) {
    alert("コインが足りません！");
    return;
  }

  if (nextPrice >= currentAuctionData.bird.price) {
    buyNow();
    return;
  }

  // 残り時間を+3秒延長（最大15秒）
  const currentNow = Date.now();
  let newEndTime = currentAuctionData.endTime + 3000;
  if (newEndTime - currentNow > 15000) {
    newEndTime = currentNow + 15000;
  }

  // Firebaseのデータを更新（これによって全プレイヤーの画面が一斉に書き換わる）
  const auctionDocRef = window.doc(window.db, "auctions", "current");
  await window.updateDoc(auctionDocRef, {
    currentPrice: nextPrice,
    highestBidder: "プレイヤー",
    highestBidderName: window.myName,
    highestBidderUid: window.myName, // 終了判定用
    endTime: newEndTime
  });
}

// 5. 即決価格での落札
async function buyNow() {
  if (!currentAuctionData || currentAuctionData.status !== "active") return;

  let coins = parseInt(localStorage.getItem("coins") || "0", 10);
  const price = currentAuctionData.bird.price;

  if (coins < price) {
    alert("コインが足りません！");
    return;
  }

  // 自分のお金を減らす
  coins -= price;
  localStorage.setItem("coins", coins.toString());
  updateCoins();

  // 図鑑に登録
  addBirdToCollection(currentAuctionData.bird);

  // オークションを「落札終了」にする
  const auctionDocRef = window.doc(window.db, "auctions", "current");
  await window.updateDoc(auctionDocRef, {
    currentPrice: price,
    highestBidderName: window.myName,
    status: "sold"
  });
  alert("即決落札しました！");
}

// 6. タイムアップによる終了処理
async function triggerEndAuction(reason) {
  if (!currentAuctionData || currentAuctionData.status !== "active") return;

  const auctionDocRef = window.doc(window.db, "auctions", "current");
  await window.updateDoc(auctionDocRef, {
    status: "timeout"
  });

  // もし自分が最終的な勝者だったら、お支払金処理と図鑑登録
  if (currentAuctionData.highestBidderName === window.myName) {
    let coins = parseInt(localStorage.getItem("coins") || "0", 10);
    coins -= currentAuctionData.currentPrice;
    localStorage.setItem("coins", coins.toString());
    updateCoins();
    addBirdToCollection(currentAuctionData.bird);
    alert("🎉 オークションに勝利し、鳥を獲得しました！");
  }
}

function addBirdToCollection(bird) {
  const collection = JSON.parse(localStorage.getItem("birdCollection") || "[]");
  collection.push(bird);
  localStorage.setItem("birdCollection", JSON.stringify(collection));
  renderCollection();
}

function renderCollection(){
  const area = document.getElementById("collection");
  area.innerHTML = "";
  const collection = JSON.parse(localStorage.getItem("birdCollection") || "[]");
  collection.forEach(b => {
    const div = document.createElement("div");
    div.className = "birdItem";
    div.innerHTML = b.emoji + " " + b.name;
    area.appendChild(div);
  });
}

window.onload = () => {
  updateCoins();
  renderCollection();
};
</script>
</body>
</html>
